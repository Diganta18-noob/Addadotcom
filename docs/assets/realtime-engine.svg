<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%">
  <defs>
    <linearGradient id="bg-grad-rt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-green-rt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber-rt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-pink-rt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dash-right {
        to {
          stroke-dashoffset: -30;
        }
      }
      @keyframes dot-blink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.2; transform: scale(0.8); }
      }
      .stream-line-green {
        stroke: #10B981;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        animation: dash-right 1s linear infinite;
      }
      .stream-line-amber {
        stroke: #F59E0B;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        animation: dash-right 1s linear infinite;
      }
      .stream-line-pink {
        stroke: #EC4899;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        animation: dash-right 1s linear infinite;
      }
      .live-dot-green { transform-origin: 20px 28px; animation: dot-blink 1.4s ease-in-out infinite; }
      .live-dot-amber { transform-origin: 20px 28px; animation: dot-blink 1.4s ease-in-out infinite 0.4s; }
      .live-dot-pink { transform-origin: 20px 28px; animation: dot-blink 1.4s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <rect width="900" height="420" rx="16" fill="url(#bg-grad-rt)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="45" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="800" letter-spacing="2">REAL-TIME SSE ARCHITECTURE</text>
  <text x="40" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">3-Layer Pub/Sub Dispatch Engine</text>

  <!-- Layer 1 -->
  <g transform="translate(40, 105)">
    <rect width="820" height="85" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <circle cx="20" cy="26" r="4" fill="#34D399" class="live-dot-green" />
    <text x="32" y="30" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="800">LAYER 1 · SCOPE: KITCHEN LINE</text>
    <text x="32" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Sub-second KDS Broadcast (&lt;500ms)</text>
    <text x="32" y="72" fill="#94A3B8" font-family="sans-serif" font-size="11">Triggers new ticket rendering, audio chime alert, and color timer initialization automatically</text>
    
    <!-- Animated Stream Line -->
    <path d="M 540 42 L 800 42" fill="none" class="stream-line-green" />
    <circle r="4" fill="#34D399" filter="url(#glow-green-rt)">
      <animateMotion path="M 540 42 L 800 42" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#FFFFFF">
      <animateMotion path="M 540 42 L 800 42" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(40, 205)">
    <rect width="820" height="85" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="20" cy="26" r="4" fill="#FBBF24" class="live-dot-amber" />
    <text x="32" y="30" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="800">LAYER 2 · SCOPE: CASHIER &amp; FLOOR</text>
    <text x="32" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Interactive Table State Sync</text>
    <text x="32" y="72" fill="#94A3B8" font-family="sans-serif" font-size="11">Synchronizes table grid status (Available, Occupied, Reserved, Bill Requested) across all admin terminals</text>
    
    <!-- Animated Stream Line -->
    <path d="M 540 42 L 800 42" fill="none" class="stream-line-amber" />
    <circle r="4" fill="#FBBF24" filter="url(#glow-amber-rt)">
      <animateMotion path="M 540 42 L 800 42" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#FFFFFF">
      <animateMotion path="M 540 42 L 800 42" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(40, 305)">
    <rect width="820" height="85" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
    <circle cx="20" cy="26" r="4" fill="#F472B6" class="live-dot-pink" />
    <text x="32" y="30" fill="#F472B6" font-family="sans-serif" font-size="12" font-weight="800">LAYER 3 · SCOPE: CUSTOMER DEVICE</text>
    <text x="32" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Live Order Tracker Stepper</text>
    <text x="32" y="72" fill="#94A3B8" font-family="sans-serif" font-size="11">Pushes instant status transitions (Placed → Preparing → Ready → Served) directly to customer browser with 0 polling HTTP calls</text>

    <!-- Animated Stream Line -->
    <path d="M 540 42 L 800 42" fill="none" class="stream-line-pink" />
    <circle r="4" fill="#F472B6" filter="url(#glow-pink-rt)">
      <animateMotion path="M 540 42 L 800 42" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#FFFFFF">
      <animateMotion path="M 540 42 L 800 42" dur="1.1s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>